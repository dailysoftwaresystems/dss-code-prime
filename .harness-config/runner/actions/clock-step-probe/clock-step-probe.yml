name: clock-step-probe
description: >-
  Counts the intervals in which this host's CLOCK_REALTIME diverged from CLOCK_MONOTONIC by more
  than the tolerance, and prints that count as `steps=`. The mechanism, the tolerance and what
  this deliberately does NOT do are documented in the program itself,
  `.harness-config/runner/actions/clock-step-probe/clock-step-probe.py`.

  ★ LAYOUT — THE OPERATOR'S RULING, AND ✔PROVEN WORKING AT DssHarness 0.5.4 (2026-09-16).
  One directory per action, named for the action, holding its `.yml` and every supporting file,
  because a `run` line is a program and its arguments with no shell, so anything that is not a
  one-liner needs a file next to the action.
  ⚠ THIS BLOCK USED TO SAY THE TOOL COULD NOT LOAD IT. At 0.5.3 that was true - `DssHarness run`
  refused with exit 12, *'is not a file name'*, from ActionFileParser.LoadAsync, and the `.yml` was
  declared here anyway rather than bent to what that version accepted. 0.5.4 loads it. The refusal is
  kept on the record only to explain why the file was written before it could run.
  ✔MEASURED at 0.5.4: the step log records `# command python3 ./clock-step-probe.py` and the witness
  fired - `clock-step-probe steps=0 samples=250 window=5.058s`. Both halves of the ruling now hold: the
  supporting file sits beside its action, and the `.yml` sits inside the action's own directory.

steps:
  - name: sample-clock-step
    # `python3` is the first token because a run line's program must be a tool the configuration
    # declares (RepoHarness.Core.Runners.ActionToolPolicy.Classify vets that token and no other);
    # the script is an ordinary argument, so a repository program needs no declaration of its own.
    # ✔MEASURED: forward slashes resolve on the Windows host as well as the POSIX ones.
    # ★ WORKING DIRECTORY. A step runs at the LEG'S TREE ROOT unless it says otherwise -
    # ✔MEASURED against 0.5.3 by a step that printed its own cwd, and it is NOT what the
    # one-directory-per-action layout reads as. `workingDirectoryRoot` names what
    # `workingDirectory` starts from: `tree` (the leg's worktree or the repository, the
    # DEFAULT), `harness` (`.harness-config`), or `action` (this directory). A step that runs
    # a program it SHIPS says `action` and names it `./probe.py`; a step that builds or tests
    # the repository says nothing and keeps the root it always had. The roots resolve against
    # the LEG's own tree, so a leg on a worktree reaches that worktree's copy.
    # ⚠ The root-relative spelling this replaces,
    #   `python3 ./.harness-config/runner/actions/clock-step-probe/clock-step-probe.py`,
    #   was ✔MEASURED WORKING and would keep working under the default root. It is replaced
    #   because the IDIOM is what a later author copies, not the path.
    # ⚠ `workingDirectoryRoot` is NOT in the PUBLISHED 0.5.3 - it is in repo-harness's working
    #   tree beside the nested-action fix, and the two arrive together. Until then
    #   `DssHarness run` refuses this runner at the ACTION-PATH check, BEFORE it parses this
    #   file, so declaring the key early costs nothing and leaves nothing to remember later.
    workingDirectoryRoot: action
    run: |
      python3 ./clock-step-probe.py
    # Exiting 0 is not proof the probe ran: an interpreter that started, printed nothing and
    # exited would pass on its exit code alone. The witness is the count itself.
    # ✔RED-ON-DISABLE, 2026-09-16, Windows host, DssHarness **0.5.4**, AT THIS LAYOUT.
    # Retaken after the nested `.yml` and `workingDirectoryRoot: action` began to load, because a
    # transcript must describe what SHIPS, and the earlier one described the flat layout.
    #   md5 before    f611a13fb7f77be2394aa712fb42b39c
    #   mutation      the program prints `count=`; this pattern, untouched, still expects `steps=`
    #   md5 moved     b8e2705188dccc482966694d5ede7ff5
    #   run           `unwitnessed (sample-clock-step exited 0 and its success pattern never
    #                 matched its output)` — **exit 5**
    #   md5 restored  f611a13fb7f77be2394aa712fb42b39c
    #   control arm   the same command, restored: `passed`, exit 0
    # ★ THE MUTANT EXITED 0 AND THE RUN STILL REFUSED. That is the whole point: this witness is
    #   what stands between a passing exit code and an interpreter that started, printed nothing
    #   and said so in no way anyone could detect.
    successPattern: "clock-step-probe steps="
