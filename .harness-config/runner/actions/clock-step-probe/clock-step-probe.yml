name: clock-step-probe
description: >-
  Counts the intervals in which this host's CLOCK_REALTIME diverged from CLOCK_MONOTONIC by more
  than the tolerance, and prints that count as `steps=`. The mechanism, the tolerance and what
  this deliberately does NOT do are documented in the program itself,
  `.harness-config/runner/actions/clock-step-probe/clock-step-probe.py`.

  ★ LAYOUT, 2026-09-16 - THIS FILE IS WHERE THE OPERATOR RULED IT GOES, AND THE TOOL CANNOT
  LOAD IT YET. The ruling is one directory per action, named for the action, holding its `.yml`
  and every supporting file, because a `run` line is a program and its arguments with no shell,
  so anything that is not a one-liner needs a file next to the action.
  ✔MEASURED the same day against DssHarness 0.5.3, with this file at exactly this path:
  `DssHarness legs` passes (exit 0); `DssHarness run` refuses with exit 12 - *'is not a file
  name. A runner's action names one file directly inside ...'* - from
  RepoHarness.Core.Runners.ActionFileParser.LoadAsync, which rejects any `action` whose
  Path.GetFileName is not the whole string. ⚠ So this runner does not run until repo-harness is
  fixed; that cost was weighed rather than absorbed - no ctest entry invokes `run`, and the four
  runners that are real work are not written yet. The layout is not bent to fit today's tool.
  ★ The upstream fix is NOT to delete the check. Its own comment gives a sound reason -
  resolving a name with a separator would let a runner run a file from anywhere on the machine,
  and *'only files a reviewer sees in this directory may declare what a runner does'* - and a
  subdirectory of `actions/` is equally reviewable. The correct form is to combine, resolve to a
  full path, and require it to remain UNDER the actions directory, which still refuses `..` and
  a rooted path.

  ⚠ THE RELATIVE PATH BELOW IS RESOLVED AGAINST THE REPOSITORY ROOT, NOT THIS DIRECTORY.
  ✔MEASURED by running a step that printed its own working directory: a `run` line starts in the
  leg's tree root. The operator's example `python3 ./bla.py` therefore does NOT work as written -
  it looks for `bla.py` beside CMakeLists.txt. A supporting file is named from the root, as here.
  This is also why the path survives the `.yml` moving into its action's directory later: it was
  never relative to the `.yml`.

steps:
  - name: sample-clock-step
    # `python3` is the first token because a run line's program must be a tool the configuration
    # declares (RepoHarness.Core.Runners.ActionToolPolicy.Classify vets that token and no other);
    # the script is an ordinary argument, so a repository program needs no declaration of its own.
    # ✔MEASURED: forward slashes resolve on the Windows host as well as the POSIX ones.
    # ★ WORKING DIRECTORY. A step runs at the LEG'S TREE ROOT unless it says otherwise -
    # ✔MEASURED against 0.5.3 by a step that printed its own cwd, and it is NOT what the
    # one-directory-per-action layout reads as. `workingDirectoryRoot` names what
    # `workingDirectory` starts from: `tree` (the leg's worktree or the repository, the
    # DEFAULT), `harness` (`.harness-config`), or `action` (this directory). A step that runs
    # a program it SHIPS says `action` and names it `./probe.py`; a step that builds or tests
    # the repository says nothing and keeps the root it always had. The roots resolve against
    # the LEG's own tree, so a leg on a worktree reaches that worktree's copy.
    # ⚠ The root-relative spelling this replaces,
    #   `python3 ./.harness-config/runner/actions/clock-step-probe/clock-step-probe.py`,
    #   was ✔MEASURED WORKING and would keep working under the default root. It is replaced
    #   because the IDIOM is what a later author copies, not the path.
    # ⚠ `workingDirectoryRoot` is NOT in the PUBLISHED 0.5.3 - it is in repo-harness's working
    #   tree beside the nested-action fix, and the two arrive together. Until then
    #   `DssHarness run` refuses this runner at the ACTION-PATH check, BEFORE it parses this
    #   file, so declaring the key early costs nothing and leaves nothing to remember later.
    workingDirectoryRoot: action
    run: |
      python3 ./clock-step-probe.py
    # Exiting 0 is not proof the probe ran: an interpreter that started, printed nothing and
    # exited would pass on its exit code alone. The witness is the count itself.
    # ✔RED-ON-DISABLE, 2026-09-16, Windows host, through `DssHarness run`: with the program's
    # token changed to `count=` and this pattern untouched, the run reported `unwitnessed -
    # sample-clock-step exited 0 and its success pattern never matched its output` and exited 5.
    # Restored, the same command passed. The witness is load-bearing, not decorative.
    successPattern: "clock-step-probe steps="
