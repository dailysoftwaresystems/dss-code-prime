# PURPOSE: refuse a duplicate, implicitly-numbered, or newly-uncovered `DiagnosticCode` ordinal.
name: check-diagnostic-codes
description: >-
  The action holds the DiagnosticCode ordinals to their rules, then proves it can fail.
  The program documents itself in its own header; this file declares only how a
  runner starts it and what witnesses that it ran.
  Gated by ctest as `diagnostic_codes_guard`.
steps:
  - name: verify-then-self-test
    workingDirectoryRoot: action
    run: |
      python3 ./check-diagnostic-codes.py
    successPattern: 'check-diagnostic-codes: self-test OK'
    requireInputsUnmoved: true

  # The self-test ALONE, without verifying the tree -- `dssharness run check-diagnostic-codes --manual-step self-test`:
  # the instrument's arms read while the tree itself is red, or while a mutant is being read.

  - name: self-test
    manual: true
    workingDirectoryRoot: action
    run: |
      python3 ./check-diagnostic-codes.py --self-test
    successPattern: '^check-diagnostic-codes: self-test OK$'
    requireInputsUnmoved: true

  # Every uncovered code, baselined or not -- a READING verb.

  - name: list-uncovered
    manual: true
    workingDirectoryRoot: action
    run: |
      python3 ./check-diagnostic-codes.py --list-uncovered
    successPattern: '^\d+ code\(s\) with no compiled test reference:$'
    requireInputsUnmoved: true

  # The ALLOCATION-TIME view: also every other worktree's working header and every ref not merged into
  # HEAD. It reads this machine's git worktrees and refs, which no synced copy carries, so it runs
  # through `dssharness run check-diagnostic-codes-cross-branch`, the runner of this machine's own tree.

  - name: cross-branch
    manual: true
    workingDirectoryRoot: action
    run: |
      python3 ./check-diagnostic-codes.py --cross-branch
    successPattern: '^check-diagnostic-codes: OK -- 0 collisions'
    requireInputsUnmoved: true
