# PURPOSE: refuse a new anchor id inside a C++ string literal under src/: operator output states the condition and the action, never the bookkeeping.
name: check-emitted-anchor-ids
description: >-
  The action refuses a new anchor id in a C++ string literal under src/, then
  proves it can fail. The program documents itself in its own header; this file
  declares only how a runner starts it and what witnesses that it ran.
  Gated by ctest as `emitted_anchor_ids_guard`.
steps:
  - name: verify-then-self-test
    workingDirectoryRoot: action
    run: |
      python3 ./check-emitted-anchor-ids.py
    successPattern: 'selftest: OK \(0 failure\(s\)\)'
    requireInputsUnmoved: true

  # The self-test ALONE, without verifying the tree -- `dssharness run check-emitted-anchor-ids --manual-step self-test`:
  # the instrument's arms read while the tree itself is red, or while a mutant is being read.

  - name: self-test
    manual: true
    workingDirectoryRoot: action
    run: |
      python3 ./check-emitted-anchor-ids.py --selftest
    successPattern: '^selftest: OK \(0 failure\(s\)\)$'
    requireInputsUnmoved: true

  # Every site the census finds, the inventory's ceilings ignored -- a READING verb.

  - name: list
    manual: true
    workingDirectoryRoot: action
    run: |
      python3 ./check-emitted-anchor-ids.py --list
    successPattern: '^emitted-anchor-ids: \d+ file\(s\) scanned, \d+ with a site$'
    requireInputsUnmoved: true
