# PURPOSE: measure what Apple's ld64 does with a second defined symbol at the address of a canonical one, with and without -dead_strip.
name: macho-alias-ld64-matrix
description: >-
  Measures what Apple's ld64 does with a SECOND defined symbol at the same address as a canonical
  one, with and without `-dead_strip`. Eight cells: three producer variants (`plain`, `altentry`,
  `setalias`) crossed with dead-strip off/on while referencing ONLY the alias, plus a
  canonical-only control at both dead-strip settings, and an n_desc dump per variant. The mechanism,
  the cells and what each one proves are documented in the program itself,
  `.harness-config/runner/actions/macho-alias-ld64-matrix/macho-alias-ld64-matrix.py`.

  ★ WHAT THIS ACTION REPLACED, AND WHY THE REPLACEMENT IS SMALLER THAN WHAT IT REPLACES.
  `scripts/macho-alias-ld64-matrix/macho-alias-ld64-matrix.sh` was two things: this measurement's
  local half, and a TRANSPORT. The transport base64-encoded the mac-side program into ONE argument
  of `scripts/ssh-macos/ssh-macos.sh` — its own comment gives the reason, *"`ssh-macos.sh --rsync`
  needs a real rsync (absent from Git Bash), and ssh joins its remaining arguments with spaces"* —
  and then reconstructed the file into `/tmp` on the Mac and ran it there. A runner reaches the Mac
  through `sync`, which has already placed this directory in that host's own copy of the repository,
  so there is nothing left to encode: the program runs where it already is. ⇒ the local half was not
  ported, it was DELETED, and the mac-side half became the whole action -- first as a bash program,
  and since 2026-09-21 as one Python program, with the same cells, the same table and the same
  generated subjects byte for byte.
  ⚠ AND THE OLD SHAPE WAS ALREADY INOPERABLE: its carriage, `scripts/ssh-macos/ssh-macos.sh`, was
  removed by the same migration, so the driver had no way to reach the Mac whether or not this
  action existed.

  ★ THIS IS A MEASUREMENT INSTRUMENT, NOT A GATE. No ctest entry depends on it — ✔MEASURED
  2026-09-17 across `CMakeLists.txt`, `cmake/**`, `tests/**`, `integrated_tests/**` and `.github/**`,
  which name it nowhere. Its ANSWER, however, is load-bearing and cited as evidence in
  `src/link/format/macho.cpp` and `tests/link/test_macho_writer.cpp`: a plain alias (n_desc = 0) is
  correct and `N_ALT_ENTRY` is not needed. Those citations are of the measurement, not of the file,
  and they name this action.

  ⚠ IT IS macOS-ONLY BY NATURE and not by configuration: every cell is `/usr/bin/clang`, `nm -m`,
  `otool -l` and Apple's ld64. There is no other host on which the question exists, and on any
  other host the program refuses by name (exit 2) before it creates anything.

steps:
  - name: alias-matrix
    # ★ THE PROGRAM RUNS THROUGH `python3`, A DECLARED TOOL ON EVERY PLATFORM (`.harness-config/config.json`,
    # `tools`), WHICH IS WHAT MAKES IT A LEGAL FIRST TOKEN. An interpreter needs no execute bit to
    # survive a sync -- the reason the step never names the program as a bare path: an earlier
    # version did, on the stated ground that "the file carries mode 100755", and ✔MEASURED
    # 2026-09-18 `git ls-files -s` recorded the shell program 100644, so the Mac would have refused
    # to execute it -- a claim about the file that nothing rechecked, on the one host no local run
    # can reach.
    # ★ `workingDirectoryRoot: action` so the program is named as `./…` beside its own `.yml`,
    # the idiom `clock-step-probe` establishes. The program builds every throwaway subject it
    # needs in a fresh `dss-macho-alias-matrix-*` directory under the Mac's system temp directory
    # -- one per run, printed first and left in place -- and reads nothing from this tree.
    workingDirectoryRoot: action
    run: |
      python3 ./macho-alias-ld64-matrix.py
    # ★ rc=0 IS NOT AN OBSERVABLE — the program's own words. The witness is the tally line the
    # matrix always emits as its last line once it has run; a host where it cannot run gets a
    # refusal by name, exit 2 and no tally line. The VERDICT stays the exit code: 0 when every
    # cell passed, 1 when any failed (the value `MATRIX_FAIL=` prints), so a run that measured bad
    # cells witnesses AND fails.
    successPattern: "MATRIX_FAIL="
    stallSeconds: 900
    # ⛔ NO `watchContention`, DELIBERATELY, AND NOT BECAUSE THE KEY IS UNAVAILABLE TODAY.
    # Nothing here is timed — the observables are symbol presence, symbol address equality, a
    # program's return value and a `__text` size — so a loaded machine cannot move a reading.
    # ⚠ AND IT MUST NOT ACQUIRE ONE LATER: `watchContention` needs a build directory to watch,
    # which an action invoked through `host-exec` with no leg does not have, and that combination
    # is refused when the action RUNS. This action is meant to be reachable that way.
    # ⛔ NO `requireInputsUnmoved` either: the only tracked file this step reads is its own
    # program, read once by the interpreter that runs it.
