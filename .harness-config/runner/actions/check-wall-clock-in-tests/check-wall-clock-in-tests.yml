# PURPOSE: refuse a new wall-clock duration literal in test code outside the shared measured budget.
name: check-wall-clock-in-tests
description: >-
  The action refuses a new wall-clock literal in test code, then proves it can fail.
  The program documents itself in its own header; this file declares only how a
  runner starts it and what witnesses that it ran.
  Gated by ctest as `wall_clock_in_tests_guard`.
steps:
  - name: verify-then-self-test
    workingDirectoryRoot: action
    run: |
      python3 ./check-wall-clock-in-tests.py
    successPattern: 'selftest: OK \(0 failure\(s\)\)'
    requireInputsUnmoved: true
