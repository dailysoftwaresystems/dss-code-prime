name: Pipeline

# CI for this C++ application. Inlined from the DSS.DevOps reusable
# `cpp-app-pr.yml@v2`: a PUBLIC repository cannot call a reusable workflow that
# lives in a private/internal repository, so the logic is vendored here. Keep in
# sync with dailysoftwaresystems/DSS.DevOps. Settings baked from the former caller
# inputs: run-macos + run-linux-arm64 ON, cache-pch-on = windows-msvc-release,
# cmake-version = latest.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  statuses: write

jobs:
  label-check:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'Run Pipes') }}
    runs-on: ${{ 'ubuntu-latest' }}
    steps:
      - name: Fail when required label is missing
        run: |
          echo "Missing '${{ 'Run Pipes' }}' label. Merge is blocked."
          exit 1

  format-check:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'Run Pipes') && true }}
    runs-on: ${{ 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ '.' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DSS_PUBLIC_BOTS_APP_ID }}
          private-key: ${{ secrets.DSS_PUBLIC_BOTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Probe for .clang-format
        id: probe
        run: |
          if [ -f .clang-format ] || [ -f _clang-format ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .clang-format at repo root — skipping format check."
          fi

      - name: clang-format dry-run
        if: ${{ steps.probe.outputs.present == 'true' }}
        # Run against the diff vs the PR base. `--relative` makes git
        # emit paths relative to the working-directory; without it,
        # paths come back repo-root-relative and clang-format (which
        # also runs in working-directory) cannot find them.
        # `--Werror` surfaces the offending file:line in the Actions
        # log without needing an extra reviewer step.
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! diff_out=$(git diff --name-only --relative --diff-filter=ACMRTUXB "$BASE_SHA"...HEAD 2>&1); then
            echo "::error::git diff against base $BASE_SHA failed: $diff_out"
            exit 1
          fi
          mapfile -t CHANGED < <(printf '%s\n' "$diff_out" | grep -E '\.(c|h|cc|cpp|cxx|hpp|hxx)$' || true)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No C/C++ files changed."
            exit 0
          fi
          printf '  %s\n' "${CHANGED[@]}"
          clang-format --dry-run --Werror "${CHANGED[@]}"

  build-matrix:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'Run Pipes') }}
    runs-on: ${{ 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
    steps:
      - id: set
        # Build the matrix `include` list from the boolean inputs. Only
        # legs whose `run-*` input is true land in the matrix, so no
        # runner is allocated for disabled legs (no more skipped-on-
        # startup macOS runs billed at premium rate).
        # ★★★ THE TWO BUDGETS ARE PER-LEG, AND EVERY NUMBER IS A MEASUREMENT.
        # `build_timeout_min` caps the Build step; `ctest_budget_min` is ctest's own
        # `--stop-time` budget and the Test step's `timeout-minutes` is that plus ten.
        #
        # ⚠ THEY USED TO BE TWO GLOBAL CONSTANTS (45 and 50), AND BOTH WERE SET FROM
        # THE LEGS THEY HAPPENED TO FIT. ✔MEASURED 2026-08-21 on run 32533052057, the
        # FIRST run on this branch where the matrix actually executed (every earlier
        # one stopped at `label-check`), every leg with a 100%-MISS ccache:
        #
        #     leg                       cold build   ctest      verdict
        #     linux-gcc-release         19m22s       274.19s    green
        #     linux-clang-asan          13m04s      >2999.79s   RED - hit the 50-min cap
        #     macos-clang-release       12m53s       286.37s    green
        #     linux-arm64-gcc-release   13m07s       178.58s    green
        #     windows-msvc-release     >45m (killed) never ran  RED - hit the 45-min cap
        #
        # The asan leg is not hung and windows is not broken: asan is Debug + ASan +
        # UBSan, ✔11,314 CPU-seconds against gcc-release's 935 (12x), and at
        # `--parallel 4` that is 47 minutes of PERFECT packing against a 50-minute
        # budget. Windows compiled 453 of 786 ninja edges in 45 minutes from a cold
        # cache. Neither number was ever wrong about its own leg; one number for five
        # legs was.
        #
        # ★ A BUDGET IS A CAP, NOT A RESERVATION. A leg that finishes early costs
        # nothing, so the only thing a larger cap buys is a longer wait when something
        # genuinely hangs — and the thing it prevents is a `timeout-minutes` kill,
        # which is a SIGNAL kill that uploads no test log at all
        # (D-CI-STEP-TIMEOUT-YIELDS-NO-TEST-LOG).
        #
        # ✔ `windows-msvc-release`'s ctest budget WAS the one number here not measured
        # on its own leg. It is now: run 32585879580, the first Windows run ever to
        # reach ctest, took **665.70 s** (10% of the 6600 s it had been given), so the
        # budget is 50/60 like the other release legs — 4.5x headroom, in family with
        # theirs. Its BUILD budget stays 120: that run had a 98.72%-hit ccache and
        # built in 1m48s, while the COLD build is the one that was killed at 45 min.
        # (D-CI-WINDOWS-CTEST-COST-IS-UNMEASURED, closed.)
        #
        # ⚠ AND THE ASAN BUDGET IS A CEILING THE CORPUS IS WALKING TOWARDS: 62% of
        # those 11,314 CPU-seconds is the 1,231-entry example + integrated corpus, which
        # grows every cycle (D-CI-ASAN-LEG-WALL-CLOCK-GROWS-WITH-THE-CORPUS).
        run: |
          legs='[]'
          if [ "${{ true }}" = "true" ]; then
            legs=$(echo "$legs" | jq -c '. + [{"name":"linux-gcc-release","os":"ubuntu-latest","cc":"gcc-13","cxx":"g++-13","build_type":"Release","sanitizers":"","build_timeout_min":45,"ctest_budget_min":50,"ctest_step_timeout_min":60}]')
          fi
          if [ "${{ true }}" = "true" ]; then
            legs=$(echo "$legs" | jq -c '. + [{"name":"linux-clang-asan","os":"ubuntu-latest","cc":"clang-19","cxx":"clang++-19","build_type":"Debug","sanitizers":"address,undefined","build_timeout_min":45,"ctest_budget_min":110,"ctest_step_timeout_min":120}]')
          fi
          if [ "${{ true }}" = "true" ]; then
            legs=$(echo "$legs" | jq -c '. + [{"name":"windows-msvc-release","os":"windows-latest","cc":"","cxx":"","build_type":"Release","sanitizers":"","build_timeout_min":120,"ctest_budget_min":50,"ctest_step_timeout_min":60}]')
          fi
          if [ "${{ true }}" = "true" ]; then
            legs=$(echo "$legs" | jq -c '. + [{"name":"macos-clang-release","os":"macos-latest","cc":"","cxx":"","build_type":"Release","sanitizers":"","build_timeout_min":45,"ctest_budget_min":50,"ctest_step_timeout_min":60}]')
          fi
          if [ "${{ true }}" = "true" ]; then
            legs=$(echo "$legs" | jq -c '. + [{"name":"linux-arm64-gcc-release","os":"ubuntu-24.04-arm","cc":"gcc-13","cxx":"g++-13","build_type":"Release","sanitizers":"","build_timeout_min":45,"ctest_budget_min":50,"ctest_step_timeout_min":60}]')
          fi
          echo "matrix={\"include\":$legs}" >> "$GITHUB_OUTPUT"
          if [ "$legs" = "[]" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::warning::All run-tests legs are disabled. No build/test will run."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.empty == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ '.' }}
        shell: bash
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DSS_PUBLIC_BOTS_APP_ID }}
          private-key: ${{ secrets.DSS_PUBLIC_BOTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      # DECLARED, NOT INHERITED. `DSS_BUILD_TESTS=ON` now runs
      # `find_package(Python3 COMPONENTS Interpreter REQUIRED)` for the
      # scripts_index_guard entry, which makes a Python interpreter a
      # CONFIGURE-TIME requirement rather than a convenience. The runner images
      # happen to ship one, so this job would pass without this step — which is
      # exactly why it is here: a dependency that works by accident of the image
      # breaks on the day the image changes, and the failure would surface as a
      # CMake error in an unrelated-looking job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git for private dependencies
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Install Linux toolchain
        # Ubuntu 24.04 ships GCC 13 by default, with full C++23 stdlib
        # (std::expected, std::format) — that's the GCC release leg.
        # We also install lld + llvm-symbolizer so sanitizer stack traces
        # are symbolicated automatically (without llvm-symbolizer on PATH,
        # ASan output is a wall of `??:?` and triage is much harder).
        #
        # Clang leg uses clang-19 (from noble-updates/universe), NOT the
        # image default clang-18. Reason: clang-18 sets __cpp_concepts to
        # 201907L, but libstdc++-13's <expected> is gated on
        # __cpp_concepts >= 202002L, so `std::expected` silently vanishes
        # ("no template named 'expected' in namespace 'std'"). clang-19
        # sets __cpp_concepts = 202002L and the header opens up.
        # clang-tools-19 carries clang-scan-deps-19 which CMake needs for
        # C++20 modules dependency scanning; libclang-rt-19-dev carries
        # the ASan/UBSan runtime libs for clang-19.
        # This keeps the ASan leg on libstdc++-13 — same stdlib as the
        # GCC release leg, so tests exercise the production stdlib rather
        # than libc++ (which has its own LLVM-18 alloc-dealloc ABI bug).
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: '1'
        run: |
          set -e
          # libtcl8.6: REPO-SPECIFIC addition (not in the DSS.DevOps template).
          # The examples/c/shipped_tcl_eval RUN witness (SQLite testfixture
          # arc, D-FFI-TCL-DESCRIPTOR) compiles a DSS binary that links
          # libtcl8.6.so and evaluates a real TCL expression at load; the x86_64
          # ubuntu legs execute it, so the runtime lib must be present. (The
          # native-arm64 leg cross-compiles the x86_64-elf target and arch-gates
          # the run, so it needs no libtcl; windows/macos are compile-only.)
          PKGS=(ninja-build llvm lld libtcl8.6 "${{ matrix.cc }}" "${{ matrix.cxx }}")
          case "${{ matrix.cc }}" in
            clang-*)
              VER="${{ matrix.cc }}"; VER="${VER#clang-}"
              PKGS+=("clang-tools-${VER}" "libclang-rt-${VER}-dev")
              ;;
          esac
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends "${PKGS[@]}"
        timeout-minutes: 10

      - name: Setup MSVC environment
        # `ilammy/msvc-dev-cmd` exports the full vcvars64 environment to
        # the runner, so subsequent `bash` steps see cl.exe + Windows SDK
        # without juggling Developer Command Prompt vs PowerShell. Pinning
        # the version explicitly avoids surprises when GitHub updates the
        # Windows image's default VS edition.
        if: ${{ startsWith(matrix.os, 'windows') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup macOS toolchain
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install ninja llvm
          # Prefer Homebrew's clang for C++23 stdlib coverage.
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Setup Ninja (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: ninja --version

      - name: Setup Ninja (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup CMake
        # Action pinned to a specific release tag — lukka/get-cmake
        # publishes versioned release tags (e.g. v4.3.3) rather than a
        # floating `v<major>`, so `@latest` is the only alternative to
        # explicit pinning. The CMake binary version is caller-controlled
        # via the `cmakeVersion` input; the action itself is pinned for
        # predictability (parity with the rhysd/actionlint:1.7.12 pin
        # in validate.yml).
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: ${{ 'latest' }}

      - name: Cache FetchContent dependencies
        # FetchContent downloads (nlohmann_json, googletest, etc.) live under
        # build/_deps/<name>-{src,subbuild}. Keying on the CMakeLists hash
        # invalidates the cache when versions change, so we never serve a
        # stale tarball but still benefit on every PR push that doesn't
        # touch the dep set.
        uses: actions/cache@v5
        with:
          path: ${{ '.' }}/${{ 'build' }}/_deps
          key: cpp-deps-${{ matrix.name }}-${{ hashFiles(format('{0}/**/CMakeLists.txt', '.')) }}
          restore-keys: |
            cpp-deps-${{ matrix.name }}-

      - name: Setup ccache
        # Content-addressed compiler cache. ccache keys each object on a hash
        # of the preprocessed source + compiler identity + flags, so a changed
        # source (production OR test) always misses and recompiles — a stale
        # binary can never be served. The actions/cache key below only affects
        # hit RATE, not correctness, so it carries no source hash. PCH-using
        # compiles are "uncacheable" to ccache unless `ccache-sloppiness` opts
        # in (applied as CCACHE_SLOPPINESS on Build); it relaxes only date/time
        # and PCH-define hashing, never source-driven output. `verbose: 1` puts
        # the per-call cacheable/uncacheable reason in the post-step stats.
        if: ${{ true }}
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: cpp-${{ matrix.name }}
          variant: ccache
          max-size: ${{ '1G' }}
          verbose: 1

      - name: Compose sanitizer flags
        if: ${{ matrix.sanitizers != '' }}
        id: san
        run: |
          # Sanitizer flags go on the same compile + link line. Each leg
          # selects which sanitizers to enable via `matrix.sanitizers`
          # (comma-separated list, e.g. "address,undefined"). The compiler
          # accepts -fsanitize=address,undefined directly.
          flags="-fsanitize=${{ matrix.sanitizers }} -fno-omit-frame-pointer -g"
          echo "cflags=$flags" >> "$GITHUB_OUTPUT"
          echo "ldflags=$flags" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: ${{ steps.san.outputs.cflags }}
          CXXFLAGS: ${{ steps.san.outputs.cflags }}
          LDFLAGS: ${{ steps.san.outputs.ldflags }}
        run: |
          # Route compilation through ccache when enabled. Setting the launcher
          # at configure time bakes `ccache <compiler>` into the Ninja rules.
          # Works for GCC/Clang/AppleClang and for MSVC cl.exe (the Windows leg
          # builds Release, so there's no separate PDB for ccache to miss).
          # Disabled -> compilers run directly.
          CACHE_ARGS=()
          if [ "${{ true }}" = "true" ]; then
            CACHE_ARGS=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B "${{ 'build' }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DDSS_BUILD_TESTS=ON \
            "${CACHE_ARGS[@]}" \
            ${{ '' }}
        timeout-minutes: 15

      # Cache the precompiled-header BINARY for legs named in `cache-pch-on`.
      # See that input: a non-byte-reproducible PCH (MSVC / MinGW on Windows)
      # rebuilt every run busts ccache because the PCH is hashed into every
      # dependent TU's key. Restoring the byte-identical PCH keeps that key
      # stable -> warm ccache hits, with PCH still ON for fast cold builds.
      # Runs AFTER Configure (which generates cmake_pch.* + the build rules)
      # and BEFORE Build (which would otherwise build the PCH). The key carries
      # the runner image (toolchain/SDK) + CMakeLists hash so a change rebuilds.
      - name: Cache precompiled headers
        if: ${{ contains('windows-msvc-release', matrix.name) }}
        id: pch-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ '.' }}/${{ 'build' }}/**/cmake_pch.pch
            ${{ '.' }}/${{ 'build' }}/**/cmake_pch.cxx.obj
            ${{ '.' }}/${{ 'build' }}/**/cmake_pch.hxx.gch
          key: cpp-pch-${{ matrix.name }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles(format('{0}/**/CMakeLists.txt', '.')) }}

      # A restored PCH carries its archived (older) mtime, so Ninja would
      # rebuild it (non-reproducibly, re-busting ccache). Make the generated
      # PCH SOURCES old and the restored PCH BINARIES new, so Ninja treats the
      # byte-identical restored PCH as up-to-date and the PCH-using TUs keep a
      # stable ccache key. Only on a cache hit (nothing to reuse on a miss).
      - name: Reuse restored PCH (skip rebuild)
        if: ${{ contains('windows-msvc-release', matrix.name) && steps.pch-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          root="${{ '.' }}/${{ 'build' }}"
          find "$root" \( -name 'cmake_pch.cxx' -o -name 'cmake_pch.hxx' \) -exec touch -d '2000-01-01' {} +
          find "$root" \( -name 'cmake_pch.pch' -o -name 'cmake_pch.cxx.obj' -o -name 'cmake_pch.hxx.gch' \) -exec touch {} +

      - name: Build
        # CCACHE_SLOPPINESS makes ccache cache precompiled-header compiles
        # (no-op when caching is off or the input is empty). Without it, every
        # PCH-using TU is "uncacheable" and the cache silently does nothing.
        env:
          CCACHE_SLOPPINESS: ${{ 'pch_defines,time_macros' }}
        run: cmake --build "${{ 'build' }}" --parallel
        timeout-minutes: ${{ matrix.build_timeout_min }}

      - name: Test
        working-directory: ${{ '.' }}/${{ 'build' }}
        env:
          # `abort_on_error=1` makes the test exe exit non-zero on first
          # sanitizer hit instead of continuing. `halt_on_error` is the
          # UBSan-side equivalent. Without these, leaks/UAF reports
          # surface in stdout but ctest still reports success.
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # `--parallel 4` runs the suite concurrently (the build step is already
        # parallel). Verified parallel-safe (isolated per-test temp dirs) at -j4;
        # cuts the wall time ~4x. `4` is portable across the Linux/Windows/macOS
        # matrix (unlike a shell `$(nproc)`), and on the ubuntu-latest runner it
        # also happens to BE the core count — this repo is public, so the standard
        # hosted runner is 4-core. MEASURED on run 30815752993, linux-gcc-release:
        # 301.8 s of summed per-test time in 75.68 s wall = 3.99x, i.e. -j4 already
        # saturates the box and there is no headroom to reclaim by raising it.
        #
        # ⚠ THE "WELL UNDER THE 30-MIN BUDGET" CLAIM THAT USED TO SIT HERE WAS
        # MEASURED AT 620 CASES AND WENT STALE. At 773 cases the ASan+UBSan leg
        # needed ~31.5 min and was KILLED at 687/773 (every test that ran passed),
        # costing 86 examples/c fixtures all of their sanitizer coverage.
        # The repair was NOT a bigger budget: the shuffle arms were 44% of the leg
        # while being the weaker instrument on it, and now scale per-leg at the
        # dss_add_shuffle_arm chokepoint in tests/CMakeLists.txt. Projected ~20.2 min.
        # See D-TEST-SHUFFLE-ARM-REPEAT-BUDGET-IS-PER-LEG.
        #
        # ★ 2026-08-10 — IT HAPPENED AGAIN, AND THIS TIME THE BUDGET *IS* THE ANSWER.
        # ✔MEASURED, run 31278675175 job 93156338162 (linux-clang-asan, PR #48): Test
        # ran 21:27:01 -> 21:57:14 = 30m13s against the 30-min cap and was killed
        # ("Terminate orphan process: pid (5677) (ctest)"), at 774 of 801 tests —
        # EVERY ONE OF THEM PASSED. 96.6% of the leg's wall clock bought 0% of a
        # verdict. The arms are not the cost this time: they were already taken to
        # their practical floor in TF-C110 (one arm alone is 475 s of 739 s and
        # already sits at repeat=1), and the corpus simply grew 773 -> 801. The
        # anchor row named exactly this fork and reserved it for the operator —
        # "more headroom has to come from the suite itself or from the budget, which
        # is a separate decision the operator has NOT been asked to make". The
        # operator was asked on 2026-08-10 and chose the budget: 60 minutes.
        # ⇒ NEW REVISIT TRIGGER, replacing the old ~25-min one: this step exceeding
        #   ~45 min, or the shuffle arms climbing back above ~20% of the leg.
        #   Re-measure the arms FIRST — that is still where the cost hides.
        #
        # ★★ AND ctest NOW GETS ITS OWN BUDGET, STRICTLY INSIDE THE STEP'S.
        # [D-CI-STEP-TIMEOUT-YIELDS-NO-TEST-LOG.] A `timeout-minutes` kill is a hard
        # signal-kill: ctest writes Testing/Temporary/LastTest.log on COMPLETION, so
        # killed it writes nothing, the upload step finds nothing, and the run above
        # had to be diagnosed by scraping 2,892 raw job-log lines to learn it died at
        # 774/801. That was the SECOND time. With --stop-time ctest finalises itself
        # and the log survives. ✔MEASURED LOCALLY 2026-08-10, all four facts:
        #   · it writes the log — 765,947 B with a real "End testing:" tail;
        #   · it exits 8, so a truncated run still FAILS the step (a partial run must
        #     never be green);
        #   · the time must be LOCAL time-of-day. A UTC form ("%H:%M:%S +0000") was
        #     ACCEPTED AND SILENTLY IGNORED — ctest ran straight past it. A guard
        #     that no-ops is worse than none, which is why this is measured and not
        #     assumed;
        #   · a stop time already in the past wraps to TOMORROW (verified: ctest ran
        #     the test normally rather than stopping instantly), so a run straddling
        #     midnight is safe.
        # THE BUDGET IS PER-LEG (`matrix.ctest_budget_min`; the table and the
        # measurements behind it are above the matrix builder). It sits ten minutes
        # under the step's own timeout because --stop-time stops ctest STARTING new
        # tests and one already running continues past it.
        run: |
          BUDGET_MIN=${{ matrix.ctest_budget_min }}
          # ⚠ `|| true` ON BOTH, AND IT IS NOT DECORATION. GitHub runs this block as
          # `bash -e {0}`, under which a failing command substitution in an assignment
          # ABORTS THE SCRIPT — so a bare `NOW=$(date …)` on a runner with no usable
          # `date` kills the step at that line, before the diagnostic below can say
          # why. ✔MEASURED while writing this: that exact shape exited 1 with NO
          # message at all. A guard that dies silently is not a guard.
          NOW=$(date "+%H:%M:%S" 2>/dev/null || true)
          # GNU (ubuntu, git-bash) then BSD (macOS). No third form exists here.
          STOP=$(date -d "+${BUDGET_MIN} minutes" "+%H:%M:%S" 2>/dev/null \
              || date -v+${BUDGET_MIN}M "+%H:%M:%S" 2>/dev/null || true)
          if [ -z "$NOW" ] || [ -z "$STOP" ]; then
            echo "::error::Cannot compute a ctest stop time: neither GNU (date -d) nor BSD (date -v) relative-date syntax works on this runner."
            echo "Refusing to run ctest without its own budget. Without it a step that runs long is killed by timeout-minutes and writes NO test log at all, which is the exact blind spot this guard closes (D-CI-STEP-TIMEOUT-YIELDS-NO-TEST-LOG)."
            exit 1
          fi
          # ★★ ASSERT THE OFFSET ACTUALLY APPLIED, AND THIS CHECK IS THE LOAD-BEARING ONE.
          # An EMPTY result is the easy failure. The dangerous one is a `date` that
          # ACCEPTS the flag and ignores the offset — BSD's `-d` means "set the DST
          # flag", so on a host where it does not error, STOP comes back as ~NOW. And
          # a stop time already reached does not stop ctest: it wraps to TOMORROW
          # (measured). So the budget would silently be ~24 h, the step would once
          # again be killed by timeout-minutes, and we would be back at the exact
          # defect this block closes — with a green-looking guard in the file.
          _secs() { awk -F: '{ print ($1 * 3600) + ($2 * 60) + $3 }' <<< "$1"; }
          DELTA=$(( ( $(_secs "$STOP") - $(_secs "$NOW") + 86400 ) % 86400 ))
          if [ "$DELTA" -lt $(( BUDGET_MIN * 60 - 120 )) ] || [ "$DELTA" -gt $(( BUDGET_MIN * 60 + 120 )) ]; then
            echo "::error::The computed ctest stop time is ${DELTA}s away, not the ~$(( BUDGET_MIN * 60 ))s asked for (now=$NOW stop=$STOP)."
            echo "This runner's \`date\` accepted a relative-offset flag and did not apply it. Refusing to run: ctest treats an already-passed stop time as TOMORROW, so the budget would silently be ~24h and the step would be killed by timeout-minutes with no test log — the defect this guard exists to close (D-CI-STEP-TIMEOUT-YIELDS-NO-TEST-LOG)."
            exit 1
          fi
          echo "ctest stop-time: $STOP (LOCAL, ${DELTA}s out) — ${BUDGET_MIN} min, inside this step's timeout-minutes"
          # ★★ REPORT HOW MUCH OF THE BUDGET THE LEG ACTUALLY USED, AND WARN BEFORE IT
          # RUNS OUT (D-CI-ASAN-LEG-WALL-CLOCK-GROWS-WITH-THE-CORPUS). A cap discovers a
          # breach only by FAILING: ✔the asan leg reached 2999.79s of a 3000s budget on
          # 2026-08-21 with nothing having said it was close, and 62% of its cost is the
          # example + integrated corpus, which grows every cycle. A leg above 80% is a
          # leg whose budget is about to need re-deriving, and this is the line that says
          # so while the run is still green.
          # ★ `$SECONDS` and NO PIPE, deliberately: `ctest | tee` would hand `$?` to tee
          # (this block runs under `bash -e {0}`, where `pipefail` is NOT set), so a
          # failing suite would report success. Timing the call is free; parsing its log
          # is not worth an exit-status hazard.
          _t0=$SECONDS
          set +e
          ctest --stop-time "$STOP" ${{ '--output-on-failure --no-tests=error --parallel 4' }}
          _rc=$?
          set -e
          _used=$(( SECONDS - _t0 ))
          _cap=$(( BUDGET_MIN * 60 ))
          echo "ctest wall clock: ${_used}s of a ${_cap}s budget ($(( _used * 100 / _cap ))%)"
          if [ "$_used" -gt $(( _cap * 8 / 10 )) ]; then
            echo "::warning::This leg used ${_used}s of its ${_cap}s ctest budget (>80%). Re-derive matrix.ctest_budget_min for '${{ matrix.name }}' from this figure before it becomes a red (D-CI-ASAN-LEG-WALL-CLOCK-GROWS-WITH-THE-CORPUS)."
          fi
          exit $_rc
        # Ten minutes above ctest's own budget: --stop-time stops ctest STARTING new
        # tests, so one already running continues past it. The longest single test on
        # the asan leg measured 513.57s, which fits inside that margin.
        #
        # ⚠⚠ THE +10 IS DONE IN THE MATRIX BUILDER, NOT HERE, AND THAT IS NOT STYLE:
        # ✔MEASURED 2026-08-22 against GitHub's own validator, two minimal
        # `workflow_dispatch` files pushed side by side — `timeout-minutes:
        # ${{ matrix.t }}` is ACCEPTED and produces no run, while `timeout-minutes:
        # ${{ matrix.t + 10 }}` is REJECTED: the workflow is refused as a whole, with a
        # zero-job run whose name is the FILE PATH. That is how this file shipped broken
        # for one commit (D-CI-STEP-TIMEOUT-MINUTES-REJECTS-AN-ARITHMETIC-EXPRESSION).
        # ★ A plain field reference is the only expression form to use here; arithmetic
        # belongs in the shell that builds the matrix, where it is ordinary code.
        timeout-minutes: ${{ matrix.ctest_step_timeout_min }}

      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            ${{ '.' }}/${{ 'build' }}/Testing/Temporary/LastTest.log
            ${{ '.' }}/${{ 'build' }}/Testing/Temporary/LastTestsFailed.log
          # `warn`, NOT `ignore` — the second half of
          # D-CI-STEP-TIMEOUT-YIELDS-NO-TEST-LOG. This step only runs on failure,
          # so "the logs a failing leg was supposed to leave are not there" is
          # always worth saying out loud; `ignore` made that absence silent, and
          # the absence is itself the diagnosis (the step was killed rather than
          # having failed a test).
          if-no-files-found: warn
          retention-days: 7

  ci-check:
    name: ci-check
    runs-on: ${{ 'ubuntu-latest' }}
    needs: [run-tests, label-check, format-check, build-matrix]
    if: ${{ always() }}
    steps:
      - name: Generate GitHub App token
        if: ${{ github.event_name == 'pull_request' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DSS_PUBLIC_BOTS_APP_ID }}
          private-key: ${{ secrets.DSS_PUBLIC_BOTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report status result
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          FAIL=0
          [ "${{ needs.label-check.result }}" = "success" ] || [ "${{ needs.label-check.result }}" = "skipped" ] || FAIL=1

          if [ "${{ contains(github.event.pull_request.labels.*.name, 'Run Pipes') }}" = "true" ]; then
            # run-tests is "skipped" only when build-matrix produced an
            # empty matrix (all legs disabled). That state is a config
            # error, not a pass — flag it via build-matrix.outputs.empty.
            if [ "${{ needs.build-matrix.outputs.empty }}" = "true" ]; then
              FAIL=1
            else
              [ "${{ needs.run-tests.result }}" = "success" ] || FAIL=1
            fi
            # format-check is skipped when label missing OR when probe finds no .clang-format.
            # "skipped" is a pass; only an outright failure should block.
            [ "${{ needs.format-check.result }}" = "success" ] || [ "${{ needs.format-check.result }}" = "skipped" ] || FAIL=1
          fi

          if [ "$FAIL" = "0" ]; then
            STATE="success"
            DESC="CI check passed"
          else
            STATE="failure"
            DESC="CI check failed"
          fi

          curl -s --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"Pipeline / ci-check result\",\"description\":\"$DESC\"}"

  # Regenerate the landing-log hash anchors from git log and fail on drift.
  # Ungated by the Run Pipes label — plan-doc hygiene matters on every PR.
  landing-log-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python scripts/refresh_landing_log/test_refresh_landing_log.py
      - name: Check landing-log hash anchors
        run: python scripts/refresh_landing_log/refresh_landing_log.py --check
