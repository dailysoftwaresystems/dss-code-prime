# Renders the "Sponsor" button on the repository.
# Docs: https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# NOTE: FUNDING.yml is a DESTINATION MAP ONLY — platform key -> username/URL.
# It has NO field for a funding goal, target amount, or description. A goal
# ("$500/month to help with costs") must be configured on the destination
# platform itself, never here. See .temp/funding-sponsorship-and-consulting-plan.md.
#
# This repo is PUBLIC, so every destination below is live the moment it is
# uncommented. Do not enable a key before its target page exists.

custom: ["https://dailysoftwaresystems.com/"]

